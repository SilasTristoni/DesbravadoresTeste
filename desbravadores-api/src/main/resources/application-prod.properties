# Perfil de produção para hospedagem
# Ative este arquivo usando a variável: SPRING_PROFILES_ACTIVE=prod

# Porta usada pela hospedagem. Em Render/Railway, a plataforma define PORT automaticamente.
server.port=${PORT:8080}
app.server.fixed-port=${PORT:8080}

# Banco de dados online
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Tomcat limits for small Railway containers
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:50}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:5}

# Uploads/anexos
# Em produção, prefira usar um disco persistente ou storage externo.
file.upload-dir=${FILE_UPLOAD_DIR:/data/uploads}

# CORS
# Para teste inicial, CORS_ALLOWED_ORIGINS pode ser "*".
# Em producao, use a URL exata do frontend web/mobile hospedado.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Segurança/JWT
# Defina uma chave grande e segura na hospedagem.
jwt.secret=${JWT_SECRET}
