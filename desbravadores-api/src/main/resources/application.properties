# Configuração da Conexão com o Banco de Dados MySQL
# PORTA CORRIGIDA DE 3000 PARA 3306
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/desbravadores_db?useTimezone=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Dialeto do Hibernate para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Outras configurações do JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Ativa o log detalhado para o Spring Security (pode ser removido ou comentado em produção)
# logging.level.org.springframework.security=DEBUG  <-- Comentado ou Removido

# Define o caminho para armazenar os arquivos de log
# logging.file.path=logs <-- Comentado ou Removido

# Configuração do JSON Web Token (JWT)
# Tempo de expiração do token em milissegundos
# 300000 ms = 5 minutos (5 * 60 * 1000)
jwt.expiration.ms=300000
jwt.secret=${JWT_SECRET:dev-only-change-this-secret-key-32-chars-minimum}
# Limita o tamanho máximo de cada ficheiro para 5MB
spring.servlet.multipart.max-file-size=5MB
# Limita o tamanho total da requisição (útil para múltiplos uploads) para 5MB
spring.servlet.multipart.max-request-size=5MB

# Configuração do diretório de upload
file.upload-dir=${FILE_UPLOAD_DIR:file}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}

# Configuração de execução unificada
# fixed: usa a porta configurada em app.server.fixed-port ou server.port
# dynamic: pede ao sistema uma porta livre automaticamente
app.server.port-mode=fixed
app.server.fixed-port=${PORT:8080}
server.port=${PORT:${app.server.fixed-port}}
